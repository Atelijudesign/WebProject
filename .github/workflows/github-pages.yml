name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        # Primer intento normal; si falla un script de instalación nativo de
        # Linux (puppeteer/sharp/canvas), se reintenta sin scripts de lifecycle.
        run: |
          npm ci --no-audit --no-fund || {
            echo "::warning::npm ci con scripts falló; reintentando con --ignore-scripts";
            npm ci --no-audit --no-fund --ignore-scripts;
          }
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: '1'

      - name: Construir aplicación (base /WebProject/)
        run: npm run build
        env:
          VITE_BASE: /WebProject/

      - name: Generar fallback SPA (404.html para rutas profundas)
        run: cp dist/index.html dist/404.html

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
